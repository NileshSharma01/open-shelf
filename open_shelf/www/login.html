<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Open Shelf</title>
</head>
<body>

<script>
(function () {

    "use strict";

    const params =
        new URLSearchParams(
            window.location.search
        );

    const redirect =
        params.get("redirect") ||
        params.get("redirect-to") ||
        "";

    let target =
        "/assets/open_shelf/frontend/pages/login.html";

    if (
        redirect &&
        redirect !== "/login" &&
        redirect !== "/login/"
    ) {
        target +=
            "?redirect=" +
            encodeURIComponent(redirect);
    }

    window.location.replace(target);

})();
</script>


<script>
(function () {
    async function updateNavigation() {
        try {
            const response = await fetch(
                "/api/method/frappe.auth.get_logged_user",
                {
                    credentials: "same-origin",
                    cache: "no-store"
                }
            );

            if (!response.ok) return;

            const data = await response.json();
            const user = data.message;

            if (!user || user === "Guest") return;

            document.querySelectorAll('a[href="/login"]').forEach(function (link) {
                link.setAttribute("href", "/profile");
                link.textContent = "My Account";
                link.onclick = null;
                link.removeAttribute("onclick");
            });
        } catch (error) {
            console.debug("Navigation session check skipped:", error);
        }
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", updateNavigation);
    } else {
        updateNavigation();
    }
})();
</script>

</body>
</html>
