<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Sales - Open Shelf</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .topbar h1 {
            margin: 0;
        }

        .back-link {
            text-decoration: none;
            color: inherit;
            font-weight: 600;
        }

        .card {
            background: #fff;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            padding: 20px;
        }

        .summary {
            margin-bottom: 18px;
            color: #666;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #e8e8e8;
        }

        th {
            background: #fafafa;
            font-weight: 700;
            white-space: nowrap;
        }

        .paid {
            font-weight: 700;
        }

        .empty {
            padding: 30px;
            text-align: center;
            color: #777;
        }

        .error {
            padding: 20px;
            color: #b00020;
            background: #fff4f4;
            border: 1px solid #f0caca;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="topbar">
            <h1>Book Sales</h1>

            <a
                class="back-link"
                href="/assets/open_shelf/frontend/pages/admin.html"
            >
                ← Back to Admin
            </a>
        </div>

        <div class="card">
            <div id="summary" class="summary">
                Loading book sales...
            </div>

            <div id="content"></div>
        </div>
    </main>

    <script>
        async function loadBookSales() {
            const summary = document.getElementById("summary");
            const content = document.getElementById("content");

            try {
                const response = await fetch(
                    "/api/method/open_shelf.api.api.get_admin_book_sales",
                    {
                        method: "GET",
                        credentials: "same-origin",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to load book sales.");
                }

                const data = await response.json();
                const result = data.message || {};
                const sales = result.sales || [];

                summary.textContent =
                    sales.length +
                    (sales.length === 1
                        ? " paid book purchase"
                        : " paid book purchases");

                if (!sales.length) {
                    content.innerHTML = `
                        <div class="empty">
                            No paid book purchases yet.
                        </div>
                    `;
                    return;
                }

                const rows = sales.map(function (sale) {
                    return `
                        <tr>
                            <td>${escapeHtml(sale.invoice_date || "")}</td>
                            <td>${escapeHtml(
                                sale.customer_name ||
                                sale.member ||
                                ""
                            )}</td>
                            <td>${escapeHtml(
                                sale.book_title ||
                                sale.book ||
                                ""
                            )}</td>
                            <td>${Number(sale.quantity || 0)}</td>
                            <td>₹${Number(sale.rate || 0).toFixed(2)}</td>
                            <td>₹${Number(sale.amount || 0).toFixed(2)}</td>
                            <td>${escapeHtml(sale.invoice || "")}</td>
                            <td class="paid">Paid</td>
                        </tr>
                    `;
                }).join("");

                content.innerHTML = `
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Customer</th>
                                    <th>Book</th>
                                    <th>Qty</th>
                                    <th>Rate</th>
                                    <th>Amount</th>
                                    <th>Invoice</th>
                                    <th>Payment</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                console.error("Open Shelf Book Sales:", error);

                summary.textContent = "Book sales";

                content.innerHTML = `
                    <div class="error">
                        Unable to load book sales.
                    </div>
                `;
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        if (document.readyState === "loading") {
            document.addEventListener(
                "DOMContentLoaded",
                loadBookSales
            );
        } else {
            loadBookSales();
        }
    </script>


<script id="openshelf-navigation-fix">
(function () {
    "use strict";

    function cleanText(value) {
        return String(value || "").replace(/\s+/g, " ").trim().toLowerCase();
    }

    function fixLinks() {
        document.querySelectorAll("a").forEach(function (link) {
            var text = cleanText(link.textContent);

            if (text === "my account") {
                link.href = "/assets/open_shelf/frontend/pages/profile.html";
                link.removeAttribute("onclick");
                link.removeAttribute("data-bs-toggle");
                link.removeAttribute("data-bs-target");
                link.removeAttribute("data-toggle");
            }

            if (text === "explore our collection") {
                link.href = "/catalogue";
                link.removeAttribute("onclick");
                link.removeAttribute("data-bs-toggle");
                link.removeAttribute("data-bs-target");
                link.removeAttribute("data-toggle");
            }
        });
    }

    document.addEventListener("click", function (event) {
        var link = event.target.closest("a");
        if (!link) return;

        var text = cleanText(link.textContent);

        if (text === "my account") {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) {
                event.stopImmediatePropagation();
            }
            window.location.assign("/assets/open_shelf/frontend/pages/profile.html");
            return;
        }

        if (text === "explore our collection") {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) {
                event.stopImmediatePropagation();
            }
            window.location.assign("/catalogue");
        }
    }, true);

    async function updateLoggedInNavigation() {
        try {
            var response = await fetch(
                "/api/method/frappe.auth.get_logged_user",
                {
                    method: "GET",
                    credentials: "include",
                    headers: {
                        "Accept": "application/json"
                    },
                    cache: "no-store"
                }
            );

            if (!response.ok) return;

            var data = await response.json();
            var user = data.message;

            if (!user || user === "Guest") {
                fixLinks();
                return;
            }

            document.querySelectorAll("a").forEach(function (link) {
                var text = cleanText(link.textContent);

                if (
                    text === "login" ||
                    link.getAttribute("href") === "/login" ||
                    link.getAttribute("href") === "/login/"
                ) {
                    link.textContent = "My Account";
                    link.href = "/assets/open_shelf/frontend/pages/profile.html";
                    link.removeAttribute("onclick");
                    link.removeAttribute("data-bs-toggle");
                    link.removeAttribute("data-bs-target");
                    link.removeAttribute("data-toggle");
                }
            });

            fixLinks();
        } catch (error) {
            console.debug("Open Shelf navigation check skipped:", error);
        }
    }

    function start() {
        fixLinks();
        updateLoggedInNavigation();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", start, { once: true });
    } else {
        start();
    }
})();
</script>

</body>
</html>
