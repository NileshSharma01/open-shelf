<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inventory | Open Shelf</title>

    <link
        rel="stylesheet"
        href="/assets/open_shelf/frontend/css/style.css"
    >

    <style>
        body {
            margin: 0;
            background: #f7f7f5;
        }

        .admin-page {
            max-width: 1350px;
            margin: 0 auto;
            padding: 35px 20px 70px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 6px;
        }

        .page-header p {
            margin: 0;
            color: #6b7280;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 27px;
            font-weight: 700;
        }

        .panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex: 1;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 500px;
        }

        .search-box input,
        .filters select {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            background: #fff;
        }

        .filters select {
            width: 190px;
        }

        .message {
            display: none;
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            background: #dcfce7;
            color: #166534;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th,
        td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            vertical-align: middle;
        }

        th {
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .03em;
        }

        td {
            font-size: 14px;
        }

        .book-title {
            font-weight: 700;
        }

        .muted {
            color: #6b7280;
        }

        .stock-good {
            font-weight: 700;
        }

        .stock-low {
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-purchase {
            background: #dcfce7;
            color: #166534;
        }

        .badge-sale {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-rental-out {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-rental-return {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-cancelled {
            background: #f3f4f6;
            color: #4b5563;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #d1d5db;
            background: #fff;
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 13px;
        }

        .action-btn:hover {
            background: #f9fafb;
        }

        .empty,
        .loading {
            padding: 40px 15px;
            text-align: center;
            color: #6b7280;
        }

        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal {
            max-width: 620px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            padding: 25px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-btn {
            border: 0;
            background: transparent;
            font-size: 25px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            font-size: 13px;
            font-weight: 600;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font: inherit;
        }

        .field textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .detail {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 13px;
        }

        .detail-label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: 600;
            word-break: break-word;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 700px) {
            .admin-page {
                padding: 25px 14px 50px;
            }

            .page-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .filters {
                flex-direction: column;
            }

            .search-box {
                max-width: none;
            }

            .filters select {
                width: 100%;
            }

            .form-grid,
            .detail-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<main class="admin-page">

    <header class="page-header">

        <div>
            <h1>Inventory</h1>
            <p>
                Monitor stock and record controlled inventory movements.
            </p>
        </div>

        <div class="header-actions">

            <button
                type="button"
                class="btn btn-outline"
                id="backBtn"
            >
                Dashboard
            </button>

            <button
                type="button"
                class="btn"
                id="purchaseBtn"
            >
                Add Stock
            </button>

        </div>

    </header>

    <div id="errorMessage" class="message error"></div>
    <div id="successMessage" class="message success"></div>

    <section class="stats">

        <div class="stat-card">
            <div class="stat-label">Books</div>
            <div class="stat-value" id="totalBooks">—</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Total Copies</div>
            <div class="stat-value" id="totalCopies">—</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Available Copies</div>
            <div class="stat-value" id="availableCopies">—</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">Rented Copies</div>
            <div class="stat-value" id="rentedCopies">—</div>
        </div>

    </section>

    <section class="panel">

        <div class="toolbar">

            <div class="filters">

                <div class="search-box">
                    <input
                        type="search"
                        id="searchInput"
                        placeholder="Search book, ISBN or transaction..."
                        autocomplete="off"
                    >
                </div>

                <select id="transactionType">
                    <option value="">All Transaction Types</option>
                    <option value="Purchase">Purchase</option>
                    <option value="Sale">Sale</option>
                    <option value="Rental Out">Rental Out</option>
                    <option value="Rental Return">Rental Return</option>
                </select>

            </div>

            <button
                type="button"
                class="btn btn-outline"
                id="refreshBtn"
            >
                Refresh
            </button>

        </div>

    </section>

    <section class="panel">

        <h2 style="margin-top:0;">
            Current Stock
        </h2>

        <div id="inventoryContainer">
            <div class="loading">
                Loading inventory...
            </div>
        </div>

    </section>

    <section class="panel">

        <h2 style="margin-top:0;">
            Transaction History
        </h2>

        <div id="transactionContainer">
            <div class="loading">
                Loading transactions...
            </div>
        </div>

    </section>

</main>


<div
    class="modal-backdrop"
    id="purchaseModal"
>
    <div class="modal">

        <div class="modal-header">

            <h2>
                Add Stock
            </h2>

            <button
                type="button"
                class="close-btn"
                id="closePurchaseBtn"
            >
                &times;
            </button>

        </div>

        <form id="purchaseForm">

            <div class="form-grid">

                <div class="field full">

                    <label for="purchaseBook">
                        Book *
                    </label>

                    <select
                        id="purchaseBook"
                        required
                    >
                        <option value="">
                            Select Book
                        </option>
                    </select>

                </div>

                <div class="field">

                    <label for="purchaseQuantity">
                        Quantity *
                    </label>

                    <input
                        id="purchaseQuantity"
                        type="number"
                        min="1"
                        step="1"
                        required
                    >

                </div>

                <div class="field">

                    <label for="purchaseDate">
                        Transaction Date *
                    </label>

                    <input
                        id="purchaseDate"
                        type="date"
                        required
                    >

                </div>

                <div class="field full">

                    <label for="purchaseNotes">
                        Notes
                    </label>

                    <textarea
                        id="purchaseNotes"
                        placeholder="Optional purchase notes..."
                    ></textarea>

                </div>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn btn-outline"
                    id="cancelPurchaseBtn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="btn"
                    id="savePurchaseBtn"
                >
                    Add Stock
                </button>

            </div>

        </form>

    </div>
</div>


<div
    class="modal-backdrop"
    id="transactionModal"
>
    <div class="modal">

        <div class="modal-header">

            <h2>
                Transaction Details
            </h2>

            <button
                type="button"
                class="close-btn"
                id="closeTransactionBtn"
            >
                &times;
            </button>

        </div>

        <div
            id="transactionDetails"
            class="detail-grid"
        ></div>

        <div class="modal-actions">

            <button
                type="button"
                class="btn btn-outline"
                id="closeTransactionActionBtn"
            >
                Close
            </button>

        </div>

    </div>
</div>


<script src="/assets/open_shelf/frontend/js/app.js"></script>

<script>
(function () {

    "use strict";

    const API =
        "/api/method/open_shelf.api.api";

    const inventoryContainer =
        document.getElementById("inventoryContainer");

    const transactionContainer =
        document.getElementById("transactionContainer");

    const searchInput =
        document.getElementById("searchInput");

    const transactionType =
        document.getElementById("transactionType");

    const purchaseModal =
        document.getElementById("purchaseModal");

    const transactionModal =
        document.getElementById("transactionModal");

    const purchaseForm =
        document.getElementById("purchaseForm");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");

    let searchTimer = null;

    function showError(message) {

        successMessage.style.display = "none";

        errorMessage.textContent =
            message || "Something went wrong.";

        errorMessage.style.display = "block";
    }

    function showSuccess(message) {

        errorMessage.style.display = "none";

        successMessage.textContent =
            message || "Operation completed.";

        successMessage.style.display = "block";

        setTimeout(function () {
            successMessage.style.display = "none";
        }, 3500);
    }

    function clearMessages() {

        errorMessage.style.display = "none";
        successMessage.style.display = "none";
    }

    function today() {

        const date =
            new Date();

        const offset =
            date.getTimezoneOffset();

        const localDate =
            new Date(
                date.getTime() -
                offset * 60 * 1000
            );

        return localDate
            .toISOString()
            .slice(0, 10);
    }

    function openModal(element) {

        element.style.display = "block";
        document.body.style.overflow = "hidden";
    }

    function closeModal(element) {

        element.style.display = "none";
        document.body.style.overflow = "";
    }

    function transactionBadge(type) {

        if (type === "Purchase") {
            return '<span class="badge badge-purchase">Purchase</span>';
        }

        if (type === "Sale") {
            return '<span class="badge badge-sale">Sale</span>';
        }

        if (type === "Rental Out") {
            return '<span class="badge badge-rental-out">Rental Out</span>';
        }

        if (type === "Rental Return") {
            return '<span class="badge badge-rental-return">Rental Return</span>';
        }

        return OpenShelf.escapeHtml(type || "Unknown");
    }

    function docstatusLabel(docstatus) {

        if (Number(docstatus) === 1) {
            return '<span class="badge badge-purchase">Submitted</span>';
        }

        if (Number(docstatus) === 2) {
            return '<span class="badge badge-cancelled">Cancelled</span>';
        }

        return '<span class="badge badge-cancelled">Draft</span>';
    }

    function renderInventory(inventory) {

        if (!inventory || !inventory.length) {

            inventoryContainer.innerHTML =
                '<div class="empty">No inventory found.</div>';

            return;
        }

        let html = `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Book</th>
                            <th>ISBN</th>
                            <th>Total</th>
                            <th>Available</th>
                            <th>Rented</th>
                            <th>Price</th>
                            <th>Rental</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        inventory.forEach(function (book) {

            const available =
                Number(book.available_copies || 0);

            const total =
                Number(book.total_copies || 0);

            const rented =
                Number(book.rented_copies || 0);

            const stockClass =
                available === 0
                    ? "stock-low"
                    : "stock-good";

            html += `
                <tr>

                    <td>
                        <div class="book-title">
                            ${OpenShelf.escapeHtml(book.book_title)}
                        </div>

                        <div class="muted">
                            ${OpenShelf.escapeHtml(book.name)}
                        </div>
                    </td>

                    <td>
                        ${OpenShelf.escapeHtml(book.isbn || "—")}
                    </td>

                    <td>
                        ${total}
                    </td>

                    <td>
                        <span class="${stockClass}">
                            ${available}
                        </span>
                    </td>

                    <td>
                        ${rented}
                    </td>

                    <td>
                        ${OpenShelf.formatPrice(book.selling_price)}
                    </td>

                    <td>
                        ${
                            Number(book.rental_allowed)
                                ? '<span class="badge badge-purchase">Yes</span>'
                                : '<span class="badge badge-cancelled">No</span>'
                        }
                    </td>

                </tr>
            `;
        });

        html += `
                    </tbody>
                </table>
            </div>
        `;

        inventoryContainer.innerHTML =
            html;
    }

    function renderTransactions(transactions) {

        if (!transactions || !transactions.length) {

            transactionContainer.innerHTML =
                '<div class="empty">No inventory transactions found.</div>';

            return;
        }

        let html = `
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Transaction</th>
                            <th>Book</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Date</th>
                            <th>Reference</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        transactions.forEach(function (transaction) {

            const reference =
                transaction.reference_name
                    ? (
                        (transaction.reference_doctype || "") +
                        ": " +
                        transaction.reference_name
                    )
                    : "—";

            html += `
                <tr>

                    <td>
                        <div class="book-title">
                            ${OpenShelf.escapeHtml(transaction.name)}
                        </div>
                    </td>

                    <td>
                        <div class="book-title">
                            ${OpenShelf.escapeHtml(transaction.book_title)}
                        </div>

                        <div class="muted">
                            ${OpenShelf.escapeHtml(transaction.book)}
                        </div>
                    </td>

                    <td>
                        ${transactionBadge(transaction.transaction_type)}
                    </td>

                    <td>
                        ${Number(transaction.quantity || 0)}
                    </td>

                    <td>
                        ${OpenShelf.escapeHtml(transaction.transaction_date || "—")}
                    </td>

                    <td>
                        ${OpenShelf.escapeHtml(reference)}
                    </td>

                    <td>
                        ${docstatusLabel(transaction.docstatus)}
                    </td>

                    <td>
                        <button
                            type="button"
                            class="action-btn"
                            data-action="view"
                            data-transaction="${OpenShelf.escapeHtml(transaction.name)}"
                        >
                            View
                        </button>
                    </td>

                </tr>
            `;
        });

        html += `
                    </tbody>
                </table>
            </div>
        `;

        transactionContainer.innerHTML =
            html;

        transactionContainer
            .querySelectorAll("[data-action='view']")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {
                        viewTransaction(
                            button.dataset.transaction
                        );
                    }
                );

            });
    }

    async function loadStats() {

        const stats =
            await OpenShelf.apiGet(
                `${API}.get_admin_inventory_stats`
            );

        document.getElementById("totalBooks").textContent =
            Number(stats.total_books || 0);

        document.getElementById("totalCopies").textContent =
            Number(stats.total_copies || 0);

        document.getElementById("availableCopies").textContent =
            Number(stats.available_copies || 0);

        document.getElementById("rentedCopies").textContent =
            Number(stats.rented_copies || 0);
    }

    async function loadInventory() {

        const search =
            searchInput.value.trim();

        const params =
            search
                ? "?search=" +
                  encodeURIComponent(search)
                : "";

        const inventory =
            await OpenShelf.apiGet(
                `${API}.get_admin_inventory${params}`
            );

        renderInventory(inventory);
    }

    async function loadTransactions() {

        const search =
            searchInput.value.trim();

        const type =
            transactionType.value;

        const params =
            new URLSearchParams();

        if (search) {
            params.set(
                "search",
                search
            );
        }

        if (type) {
            params.set(
                "transaction_type",
                type
            );
        }

        const query =
            params.toString();

        const transactions =
            await OpenShelf.apiGet(
                `${API}.get_admin_inventory_transactions` +
                (query ? "?" + query : "")
            );

        renderTransactions(transactions);
    }

    async function loadAll() {

        clearMessages();

        inventoryContainer.innerHTML =
            '<div class="loading">Loading inventory...</div>';

        transactionContainer.innerHTML =
            '<div class="loading">Loading transactions...</div>';

        try {

            await Promise.all([
                loadStats(),
                loadInventory(),
                loadTransactions()
            ]);

        } catch (error) {

            console.error(
                "Inventory loading error:",
                error
            );

            showError(
                error.message ||
                "Unable to load inventory."
            );

            inventoryContainer.innerHTML =
                '<div class="empty">Unable to load inventory.</div>';

            transactionContainer.innerHTML =
                '<div class="empty">Unable to load transactions.</div>';
        }
    }

    async function loadBookOptions() {

        const books =
            await OpenShelf.apiGet(
                `${API}.get_admin_books`
            );

        const select =
            document.getElementById("purchaseBook");

        select.innerHTML =
            '<option value="">Select Book</option>';

        (books || []).forEach(function (book) {

            const option =
                document.createElement("option");

            option.value =
                book.name;

            option.textContent =
                `${book.book_title} (${book.name})`;

            select.appendChild(option);
        });
    }

    async function openPurchaseModal() {

        clearMessages();

        try {

            await loadBookOptions();

            document.getElementById("purchaseQuantity").value =
                "";

            document.getElementById("purchaseDate").value =
                today();

            document.getElementById("purchaseNotes").value =
                "";

            openModal(purchaseModal);

        } catch (error) {

            console.error(
                "Book options loading error:",
                error
            );

            showError(
                error.message ||
                "Unable to load books."
            );
        }
    }

    async function savePurchase(event) {

        event.preventDefault();

        clearMessages();

        const book =
            document.getElementById("purchaseBook").value;

        const quantity =
            document.getElementById("purchaseQuantity").value;

        const transactionDate =
            document.getElementById("purchaseDate").value;

        const notes =
            document.getElementById("purchaseNotes").value.trim();

        if (!book) {
            showError("Please select a book.");
            return;
        }

        if (!quantity || Number(quantity) <= 0) {
            showError("Quantity must be greater than 0.");
            return;
        }

        if (!transactionDate) {
            showError("Transaction date is required.");
            return;
        }

        const saveButton =
            document.getElementById("savePurchaseBtn");

        saveButton.disabled = true;
        saveButton.textContent = "Saving...";

        try {

            await OpenShelf.apiPost(
                `${API}.create_admin_inventory_purchase`,
                {
                    book: book,
                    quantity: quantity,
                    transaction_date: transactionDate,
                    notes: notes
                }
            );

            closeModal(purchaseModal);

            showSuccess(
                "Stock added successfully."
            );

            await loadAll();

        } catch (error) {

            console.error(
                "Inventory purchase error:",
                error
            );

            showError(
                error.message ||
                "Unable to add stock."
            );

        } finally {

            saveButton.disabled = false;
            saveButton.textContent = "Add Stock";
        }
    }

    async function viewTransaction(transactionName) {

        clearMessages();

        try {

            const transaction =
                await OpenShelf.apiGet(
                    `${API}.get_admin_inventory_transaction?transaction=` +
                    encodeURIComponent(transactionName)
                );

            const reference =
                transaction.reference_name
                    ? (
                        (transaction.reference_doctype || "") +
                        ": " +
                        transaction.reference_name
                    )
                    : "—";

            const notes =
                transaction.notes ||
                "—";

            document.getElementById("transactionDetails").innerHTML = `

                <div class="detail">
                    <div class="detail-label">Transaction ID</div>
                    <div class="detail-value">
                        ${OpenShelf.escapeHtml(transaction.name)}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Book</div>
                    <div class="detail-value">
                        ${OpenShelf.escapeHtml(transaction.book_title)}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Book ID</div>
                    <div class="detail-value">
                        ${OpenShelf.escapeHtml(transaction.book)}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Transaction Type</div>
                    <div class="detail-value">
                        ${transactionBadge(transaction.transaction_type)}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Quantity</div>
                    <div class="detail-value">
                        ${Number(transaction.quantity || 0)}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Transaction Date</div>
                    <div class="detail-value">
                        ${OpenShelf.escapeHtml(transaction.transaction_date || "—")}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Reference</div>
                    <div class="detail-value">
                        ${OpenShelf.escapeHtml(reference)}
                    </div>
                </div>

                <div class="detail">
                    <div class="detail-label">Document Status</div>
                    <div class="detail-value">
                        ${docstatusLabel(transaction.docstatus)}
                    </div>
                </div>

                <div class="detail" style="grid-column:1 / -1;">
                    <div class="detail-label">Notes</div>
                    <div class="detail-value">
                        ${OpenShelf.escapeHtml(notes)}
                    </div>
                </div>

            `;

            openModal(transactionModal);

        } catch (error) {

            console.error(
                "Transaction loading error:",
                error
            );

            showError(
                error.message ||
                "Unable to load transaction."
            );
        }
    }

    document.getElementById("purchaseBtn")
        .addEventListener(
            "click",
            openPurchaseModal
        );

    document.getElementById("closePurchaseBtn")
        .addEventListener(
            "click",
            function () {
                closeModal(purchaseModal);
            }
        );

    document.getElementById("cancelPurchaseBtn")
        .addEventListener(
            "click",
            function () {
                closeModal(purchaseModal);
            }
        );

    document.getElementById("closeTransactionBtn")
        .addEventListener(
            "click",
            function () {
                closeModal(transactionModal);
            }
        );

    document.getElementById("closeTransactionActionBtn")
        .addEventListener(
            "click",
            function () {
                closeModal(transactionModal);
            }
        );

    purchaseModal.addEventListener(
        "click",
        function (event) {
            if (event.target === purchaseModal) {
                closeModal(purchaseModal);
            }
        }
    );

    transactionModal.addEventListener(
        "click",
        function (event) {
            if (event.target === transactionModal) {
                closeModal(transactionModal);
            }
        }
    );

    purchaseForm.addEventListener(
        "submit",
        savePurchase
    );

    document.getElementById("refreshBtn")
        .addEventListener(
            "click",
            loadAll
        );

    document.getElementById("backBtn")
        .addEventListener(
            "click",
            function () {
                window.location.href =
                    "/assets/open_shelf/frontend/pages/admin.html";
            }
        );

    searchInput.addEventListener(
        "input",
        function () {

            clearTimeout(searchTimer);

            searchTimer =
                setTimeout(
                    function () {
                        loadInventory()
                            .catch(function (error) {
                                showError(
                                    error.message ||
                                    "Unable to load inventory."
                                );
                            });

                        loadTransactions()
                            .catch(function (error) {
                                showError(
                                    error.message ||
                                    "Unable to load transactions."
                                );
                            });
                    },
                    300
                );
        }
    );

    transactionType.addEventListener(
        "change",
        function () {

            loadTransactions()
                .catch(function (error) {
                    showError(
                        error.message ||
                        "Unable to load transactions."
                    );
                });
        }
    );

    async function initialize() {

        try {

            const currentUser =
                await OpenShelf.getCurrentUser();

            if (!currentUser || currentUser === "Guest") {

                const redirectTo =
                    window.location.pathname +
                    window.location.search;

                window.location.href =
                    "/login?redirect-to=" +
                    encodeURIComponent(redirectTo);

                return;
            }

            await loadAll();

        } catch (error) {

            console.error(
                "Admin inventory initialization error:",
                error
            );

            showError(
                error.message ||
                "Unable to initialize inventory."
            );
        }
    }

    initialize();

})();
</script>

</body>
</html>
